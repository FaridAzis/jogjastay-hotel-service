<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Staf · JogjaStay</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/staff/staff.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <aside class="login-art">
      <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1200&q=75" alt=""
           onerror="this.onerror=null;this.src='/img/room-placeholder.svg'">
      <div class="login-art-text">
        <a href="/" class="brand light"><img src="/img/logo.svg" alt="" width="34" height="34"><span>JogjaStay</span></a>
        <h1>Panel staf hotel</h1>
        <p>Kelola reservasi, check-in, pembayaran, kamar, dan integrasi aplikasi partner dari satu tempat.</p>
      </div>
    </aside>

    <main class="login-main">
      <form class="login-form" id="loginForm">
        <a href="/" class="back">← Kembali ke website</a>
        <h2>Masuk</h2>
        <p class="muted">Khusus admin dan resepsionis.</p>
        <label class="field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label>
        <label class="field"><span>Password</span>
          <div class="pw"><input name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password">Lihat</button></div>
        </label>
        <div class="form-error" id="loginErr" role="alert"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">Masuk</button>
      </form>
    </main>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const next = new URLSearchParams(location.search).get('next');
  const target = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard';
  document.getElementById('pwToggle').onclick = (e) => {
    const i = form.password; i.type = i.type === 'password' ? 'text' : 'password';
    e.target.textContent = i.type === 'password' ? 'Lihat' : 'Sembunyi';
  };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
    btn.disabled = true; btn.textContent = 'Memeriksa…'; err.textContent = '';
    try {
      const res = await fetch('/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      location.href = target;
    } catch (ex) {
      err.textContent = ex.message || 'Gagal login'; btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
